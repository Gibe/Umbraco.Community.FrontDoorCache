name: Build

on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set package version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=$(tr -d '[:space:]' < version.txt)-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore src/Umbraco.Community.FrontDoorCache.sln

      - name: Build
        run: dotnet build src/Umbraco.Community.FrontDoorCache.sln --configuration Release --no-restore /p:Version=$PACKAGE_VERSION

      - name: Pack
        run: dotnet pack src/Umbraco.Community.FrontDoorCache.sln --configuration Release --no-build --output nuget /p:PackageVersion=$PACKAGE_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: nuget/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: nuget

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "nuget/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
